<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>Document</title>

	<script src="libs/gsap/gsap.min.js" defer></script>
	<script src="libs/gsap/ScrollTrigger.min.js" defer></script>
	<script src="libs/gsap/ScrollSmoother.min.js" defer></script>

	<link rel="stylesheet" href="css/main.css" />
	<script src="js/app.js" defer></script>
</head>
<body>

	<div class="wrapper">
		<div class="content">

			<header class="hero-section">
				<img data-speed=".6" class="hero" src="img/hero.png" alt="Alt" />
				<div class="container">
					<div data-speed=".75" class="main-header">
						<h1 class="main-title">ANGEL</h1>
					</div>
				</div>
			</header>

			<div class="portfolio">
				<div class="container">
					<main class="gallery">

						<div data-speed=".9" class="gallery__left">

							<img class="gallery__item" src="img/work/1.jpg" alt="Alt" />
							<img class="gallery__item" src="img/work/2.jpg" alt="Alt" />

							<!-- компактный lyric player (левый блок) -->
							<div class="text-block gallery__item lyric-block">
								<div class="lyric-player">
									<button class="lyric-play" aria-label="Play/Pause">►</button>
									<div class="lyric-display" aria-live="polite"></div>
									<audio id="sino-audio" src="img/work/sino.mp3" preload="metadata"></audio>
								</div>
								<p class="text-block__p">ᅠᅠ ᅠ ᅠ ᅠ ᅠᅠᅠ ᅠ ᅠ ᅠ ᅠ ᅠᅠ ᅠ ᅠ ᅠ ᅠᅠ </p>
							</div>

							<img class="gallery__item" src="img/work/6.jpg" alt="Alt" />
							<!-- <img class="gallery__item" src="img/work/7.jpg" alt="Alt" /> -->
							<!--  <img class="gallery__item" src="img/work/8.jpg" alt="Alt" /> -->
							<img class="gallery__item" src="img/work/8.jpg" alt="Alt" /> 

						</div>

						<div data-speed="1.1" class="gallery__right">

							<!-- компактный lyric display (правый блок) -->
							<div class="text-block gallery__item lyric-block">
								<div class="lyric-player small">
									<div class="lyric-display" aria-live="polite"></div>
								</div>
								<p class="text-block__p">ᅠᅠ ᅠ ᅠ ᅠ ᅠ ᅠᅠ ᅠ ᅠ ᅠ ᅠ ᅠᅠ ᅠ ᅠ ᅠᅠᅠ  </p>
							</div>

							<img class="gallery__item" src="img/work/4.jpg" alt="Alt" />
							<img class="gallery__item" src="img/work/5.jpg" alt="Alt" />
							<img class="gallery__item" src="img/work/3.jpg" alt="Alt" />
							<img class="gallery__item" src="img/work/7.jpg" alt="Alt" />
							<!-- <img class="gallery__item" src="img/work/11.jpg" alt="Alt" />
							<img class="gallery__item" src="img/work/12.jpg" alt="Alt" /> -->

						</div>

					</main>
				</div>
			</div>

		</div>
	</div>

</body>
</html>
